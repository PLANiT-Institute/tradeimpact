name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ti-framework }
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check ti_framework tests
      - run: mypy ti_framework
      - run: pytest

  theory-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_sync.py

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "ti-framework[dev]"
      - run: pip install -e "mcp-server[dev]"
      - run: ruff check mcp-server ti-framework/ti_framework/alignment
      - run: pytest -q mcp-server/tests ti-framework/tests/test_alignment.py ti-framework/tests/test_alignment_service.py

  dataset-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e "ti-framework"
      - run: python data-pipeline/build_dataset.py
      - run: python data-pipeline/check_published.py
      # check_published.py above owns staleness: it recomputes every value and compares with a
      # numeric tolerance, which is the right test for floats that libm may round differently
      # on another machine. This step covers what git diff cannot see — an output file the
      # build creates that was never committed.
      - name: Published data must have no uncommitted output files
        run: |
          untracked=$(git ls-files --others --exclude-standard -- data/published)
          if [ -n "$untracked" ]; then
            echo "build_dataset.py produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi
          echo "tracked drift (informational; check_published.py is the gate):"
          git status --porcelain -- data/published || true
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web

  # The static web app must build from the committed published dataset alone.
  web-clean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --prefix web
      - run: npm run build --prefix web
