[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeimpact-mcp"
version = "0.1.0"
description = "Read-only MCP server for exported-product cohorts and destination climate pathways"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "PLANiT Institute" }]
dependencies = [
    "mcp>=2.0,<3",
    "ti_framework>=0.1,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
tradeimpact-mcp = "tradeimpact_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tradeimpact_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
