[project]
name = "tradeimpact-auto"
version = "0.1.0"
description = "Trade Impact automotive case study: data extraction and model scripts"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

# Runnable scripts only; nothing is installed as a package.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
