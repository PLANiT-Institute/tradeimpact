<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  color-scheme: light;
  --ink: #14161a; --muted: #5f6873; --faint: #8b95a1; --rule: #dbe0e7; --bg: #eef1f5;
  --paper: #ffffff; --panel: #f5f7f9; --accent: #1f4e79; --accent-soft: #e8eff7;
  --ok: #1f7a5a; --ok-soft: #e2f2ea; --warn: #b07a12; --warn-soft: #fbf1d8;
  --bad: #b23a3a; --bad-soft: #f7e3e1;
  --l-input: #6b7b8c; --l-catalogue: #8a6d3b; --l-processed: #2f6f52; --l-result: #8a3b52;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink: #e7eaef; --muted: #9ba5b3; --faint: #6b7481; --rule: #2c333d; --bg: #0e1116;
    --paper: #161a20; --panel: #1b2027; --accent: #8fb8e6; --accent-soft: #1c2836;
    --ok: #4fc39a; --ok-soft: #13271e; --warn: #d7a94a; --warn-soft: #322a12;
    --bad: #e07a72; --bad-soft: #2e1816;
    --l-input: #9fb0c2; --l-catalogue: #d0ab6a; --l-processed: #6fc39a; --l-result: #dd8ba0;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 13.5px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
code { font: 0.9em ui-monospace, "SF Mono", Menlo, monospace; }
button { font: inherit; cursor: pointer; }
a { color: var(--accent); }

.top { display: flex; align-items: center; gap: 16px; padding: 9px 18px; background: var(--paper);
  border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 30; }
.brand { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  white-space: nowrap; }
.modes { display: flex; gap: 4px; }
.mode { border: 1px solid transparent; background: none; color: var(--muted); padding: 6px 13px;
  border-radius: 8px; font-weight: 560; }
.mode.on { background: var(--accent-soft); color: var(--accent); }
.mode:hover:not(.on) { background: var(--panel); }
.links { margin-left: auto; display: flex; gap: 12px; font-size: 12px; }
.links a { color: var(--muted); text-decoration: none; }
.links a:hover { color: var(--accent); text-decoration: underline; }
.status { font-size: 11.5px; color: var(--muted); min-width: 150px; text-align: right; }
.status.err { color: var(--bad); }

main { padding: 18px; max-width: 1500px; margin: 0 auto; }
.bar2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.chip { border: 1px solid var(--rule); background: var(--paper); color: var(--muted);
  padding: 5px 11px; border-radius: 999px; font-weight: 540; font-size: 12.5px; }
.chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--rule);
  border-radius: 8px; background: var(--paper); color: var(--ink); min-width: 220px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
  margin-bottom: 18px; }
.kpi { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px;
  padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .v { font-size: 27px; font-weight: 640; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .k { font-size: 12px; color: var(--muted); margin-top: 3px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px;
  padding: 14px 16px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 2px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.card .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.card .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 2px 0;
  font-variant-numeric: tabular-nums; }
.card .row span:first-child { color: var(--muted); }
.tlist { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 5px; }
.tchip { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px;
  padding: 2px 7px; font-size: 11.5px; color: var(--ink); cursor: pointer; }
.tchip:hover { border-color: var(--accent); color: var(--accent); }

.h { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 640; }
.h-ok { background: var(--ok-soft); color: var(--ok); }
.h-watch { background: var(--warn-soft); color: var(--warn); }
.h-stale { background: var(--warn-soft); color: var(--warn); }
.h-unlicensed { background: var(--bad-soft); color: var(--bad); }
.h-empty { background: var(--bad-soft); color: var(--bad); }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--rule);
  margin-top: 7px; }
.bar i { display: block; }
.bar .a { background: var(--ok); } .bar .b { background: var(--warn); } .bar .c { background: var(--bad); }

table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12.5px;
  font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align: right;
  white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--panel); color: var(--muted);
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--ink); }
tbody tr:hover td { background: var(--accent-soft); }
td.txt { text-align: left; white-space: nowrap; max-width: 320px; overflow: hidden;
  text-overflow: ellipsis; color: var(--muted); font-size: 11.5px; }
td.clip { cursor: help; }
.name { font-weight: 560; color: var(--ink); cursor: pointer; }
.name:hover { color: var(--accent); text-decoration: underline; }
.wrap { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px;
  box-shadow: var(--shadow); overflow: hidden; }
.scroll { overflow: auto; max-height: calc(100vh - 230px); }

svg { display: block; }
.node rect { rx: 7; stroke-width: 1.2; cursor: pointer; }
.node text { font-size: 11px; fill: var(--ink); pointer-events: none; }
.node .meta { font-size: 9.5px; fill: var(--faint); }
.node:hover rect { stroke-width: 2.4; }
.link { fill: none; stroke: var(--faint); stroke-opacity: .5; stroke-width: 1.1; }
.link.hot { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2; }
.lane { font-size: 11px; fill: var(--muted); letter-spacing: .12em; text-transform: uppercase; }

#tip { position: fixed; z-index: 60; max-width: 380px; background: var(--ink); color: var(--paper);
  padding: 8px 11px; border-radius: 8px; font-size: 12px; line-height: 1.5; white-space: normal; }
dialog { border: 1px solid var(--rule); border-radius: 14px; padding: 0; width: min(960px, 94vw);
  max-height: 88vh; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dh { padding: 15px 20px; border-bottom: 1px solid var(--rule); display: flex; align-items: baseline;
  gap: 10px; position: sticky; top: 0; background: var(--paper); }
.dh h2 { margin: 0; font-size: 16px; }
.dh .x { margin-left: auto; border: 1px solid var(--rule); background: var(--paper);
  border-radius: 8px; padding: 4px 10px; color: var(--muted); }
.db { padding: 16px 20px; overflow: auto; max-height: calc(88vh - 60px); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 20px;
  margin-bottom: 14px; font-size: 12.5px; }
.kv div span { color: var(--muted); display: block; font-size: 11px; }
.sec { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
  margin: 16px 0 7px; }
.hidden { display: none !important; }
#opener { display: grid; place-items: center; padding: 60px 20px; }
</style>
</head>
<body>

<div class="top">
  <span class="brand">PLANiT &middot; Trade &middot; Data catalogue</span>
  <div class="modes" id="modes">
    <button class="mode on" data-mode="overview">한눈에 · Overview</button>
    <button class="mode" data-mode="structure">구조 · Structure</button>
    <button class="mode" data-mode="tables">테이블 · Tables</button>
    <button class="mode" data-mode="sources">소스 · Sources</button>
  </div>
  <span class="links">
    <a href="app.html">Workbench</a>
    <a href="report/ti_automotive_report.html">Report</a>
  </span>
  <span class="status" id="status">opening __DB_FILE__…</span>
</div>

<div id="tip" class="hidden"></div>

<div id="opener"><div class="card" style="max-width:560px">
  <h3>This catalogue reads the database beside it</h3>
  <p id="opener-msg" style="color:var(--muted)">Serve the sector directory and reload, or pick
    <code>__DB_FILE__</code>.</p>
  <p><input type="file" id="dbfile" accept=".sqlite"></p>
  <p style="font-size:12px;color:var(--muted)">Serve with
    <code>.venv/bin/python script/auto/app/serve_app.py</code>, then open <code>__SERVE_URL__</code>.</p>
</div></div>

<main id="app" class="hidden"><div id="view"></div></main>

<dialog id="detail"><div class="dh"><h2 id="d-name"></h2><span id="d-health"></span>
  <button class="x" id="d-close">Close</button></div>
  <div class="db" id="d-body"></div></dialog>

<script src="__SQLJS_DIR__sql-wasm.js" integrity="__SQLJS_SRI__" crossorigin="anonymous"
  referrerpolicy="no-referrer" onerror="window.__sqljsFailed=true"></script>
<script>
'use strict';
const CDN_DIR='__SQLJS_DIR__', DB_FILE='__DB_FILE__', DB_RELATIVE='__DB_RELATIVE__';
const SERVED_DB='__SERVED_DB__', SERVE_PORT='__SERVE_PORT__';
let SQL=null, DB=null;
let TABLES=[], COLUMNS=[], RELATIONS=[], LICENCES={}, PROVIDERS={};
let DERIVED=false;              // true when the file carries no catalogue of its own
const COLCACHE={};              // table -> columns, computed on demand in derived mode
const state={mode:'overview', dataset:'all', layer:'all', health:'all', q:''};
const LAYERS=['input','catalogue','processed','result'];
const LAYER_LABEL={input:'입력 Input', catalogue:'카탈로그 Catalogue', processed:'처리 Processed', result:'결과 Result'};

const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=(v)=>v==null||v===''?'—':Number(v).toLocaleString('en-US');
const num2=(v)=>{if(v===''||v==null)return '';const n=Number(v);
  if(!isFinite(n)||String(v).trim()==='')return v;
  return Number.isInteger(n)?String(n):String(Number(n.toFixed(2)));};
const pct=(v)=>v===''||v==null?'—':(Number(v)*100).toFixed(0)+'%';
function Q(sql,p){const o=[];const st=DB.prepare(sql);if(p)st.bind(p);
  while(st.step())o.push(st.getAsObject());st.free();return o;}
function setStatus(h,bad){$('status').innerHTML=h;$('status').classList.toggle('err',!!bad);}
const has=(t)=>Q("SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",[t]).length>0;

/* A database that carries no schema_* catalogue — any SQLite file the user opens — is described
   here instead. Table facts are cheap and computed now; column statistics are not, so they are
   computed when a table's detail is opened and cached. */
function deriveCatalogue(){
  DERIVED=true;
  const names=Q("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").map((r)=>r.name);
  TABLES=names.map((n)=>{
    const rows=(Q('SELECT COUNT(*) c FROM "'+n+'"')[0]||{}).c||0;
    const cols=Q('PRAGMA table_info("'+n+'")');
    const years=[];
    cols.forEach((c)=>{ if(/(^|_)(year|vintage)$/i.test(c.name)){
      const r=Q('SELECT MIN(CAST("'+c.name+'" AS INTEGER)) lo, MAX(CAST("'+c.name+'" AS INTEGER)) hi FROM "'+n+'" WHERE "'+c.name+'" != \'\'')[0]||{};
      if(r.lo>1900) years.push(r.lo,r.hi); } });
    return {table:n, dataset:'(file)', kind:'table', layer:'processed',
      description:'', grain:cols.filter((c)=>c.pk).map((c)=>c.name).join(';'),
      rows:rows, columns:cols.length,
      data_year_min:years.length?Math.min(...years):'', data_year_max:years.length?Math.max(...years):'',
      tier_a:0, tier_b:0, tier_c:0, tier_c_share:'', source_path:'', licences:'',
      raw_redistribution:'', health:rows?'ok':'empty',
      health_reason:rows?'rows present':'no rows'};
  });
  RELATIONS=deriveRelations(names);
  COLUMNS=[];
}

/* Relations for a foreign database: its own foreign keys where it declares them, and otherwise
   a name match — a column that is another table's primary key, which is how an export like the
   Arc exchange layer carries its joins. Both are labelled so neither is mistaken for the other. */
function deriveRelations(names){
  const out=[], seen=new Set();
  const pkOf={};
  names.forEach((n)=>{ const pks=Q('PRAGMA table_info("'+n+'")').filter((c)=>c.pk).map((c)=>c.name);
    if(pks.length===1) pkOf[pks[0]]=n; });
  names.forEach((n)=>{
    Q('PRAGMA foreign_key_list("'+n+'")').forEach((fk)=>{
      const k=n+'>'+fk.table+'|'+fk.from; if(seen.has(k))return; seen.add(k);
      out.push({from_table:n, from_columns:fk.from, to_table:fk.table, to_columns:fk.to||fk.from, kind:'foreign key'}); });
    Q('PRAGMA table_info("'+n+'")').forEach((c)=>{
      const target=pkOf[c.name];
      if(!target||target===n) return;
      const k=n+'>'+target+'|'+c.name; if(seen.has(k))return; seen.add(k);
      out.push({from_table:n, from_columns:c.name, to_table:target, to_columns:c.name, kind:'inferred'}); });
  });
  return out;
}

/* Column statistics for one table, from the catalogue when the file has one and computed here
   when it does not. */
function columnsFor(table){
  if(!DERIVED) return COLUMNS.filter((c)=>c.table===table);
  if(COLCACHE[table]) return COLCACHE[table];
  const info=Q('PRAGMA table_info("'+table+'")');
  const total=(Q('SELECT COUNT(*) c FROM "'+table+'"')[0]||{}).c||0;
  const rows=info.map((c,i)=>{
    const type=(c.type||'TEXT').toUpperCase();
    const numeric=type.includes('INT')||type.includes('REAL')||type.includes('NUM')||type.includes('FLOA')||type.includes('DOUB');
    let blanks=0, distinct=0, lo='', hi='', example='';
    if(total){
      const s=Q('SELECT COUNT(DISTINCT "'+c.name+'") d, SUM(CASE WHEN "'+c.name+'" IS NULL OR "'+c.name+'"=\'\' THEN 1 ELSE 0 END) b FROM "'+table+'"')[0]||{};
      distinct=s.d||0; blanks=s.b||0;
      if(numeric){ const m=Q('SELECT MIN("'+c.name+'") lo, MAX("'+c.name+'") hi FROM "'+table+'"')[0]||{}; lo=m.lo==null?'':m.lo; hi=m.hi==null?'':m.hi; }
      const e=Q('SELECT "'+c.name+'" v FROM "'+table+'" WHERE "'+c.name+'" IS NOT NULL AND "'+c.name+'"!=\'\' LIMIT 1')[0];
      example=e?String(e.v).slice(0,80):'';
    }
    return {table:table, column:c.name, position:i+1, type:type, role:c.pk?'key':(numeric?'measure':'dimension'),
      blanks:blanks, blank_share:total?blanks/total:'', distinct:distinct, min:lo, max:hi, example:example, references:''};
  });
  COLCACHE[table]=rows;
  return rows;
}
function clip(t){const s=String(t==null?'':t);return s.length<=40?'<td class="txt">'+esc(s)+'</td>'
  :'<td class="txt clip" data-full="'+esc(s)+'">'+esc(s)+'</td>';}

/* family: collapse the per-market variants into one node for the diagram */
const FAMILY=(t)=>t.replace(/_(eu27|us|kr|jp|au)$/,'_*');

/* ------------------------------------------------------------ overview */
function drawOverview(){
  const byDs={};
  TABLES.forEach((t)=>{ (byDs[t.dataset]=byDs[t.dataset]||[]).push(t); });
  const rows=TABLES.length, allRows=TABLES.reduce((a,t)=>a+ +t.rows,0);
  const h=(k)=>TABLES.filter((t)=>t.health===k).length;
  const years=TABLES.map((t)=>+t.data_year_min).filter((y)=>y>1900);
  const kpis=[
    [fmtN(rows),'tables'],[fmtN(allRows),'rows'],[fmtN(DERIVED?TABLES.reduce((a,t)=>a+ +t.columns,0):COLUMNS.length),'columns'],
    [fmtN(Object.keys(byDs).length),'datasets'],
    [h('ok'),'healthy'],[h('watch')+h('stale'),'watch / stale'],
    [h('unlicensed')+h('empty'),'unlicensed / empty'],
    [years.length?Math.min(...years)+'–'+Math.max(...TABLES.map((t)=>+t.data_year_max).filter((y)=>y>1900)):'—','data years'],
  ];
  const cards=Object.keys(byDs).sort().map((ds)=>{
    const ts=byDs[ds];
    const a=ts.reduce((s,t)=>s+ +t.tier_a,0), b=ts.reduce((s,t)=>s+ +t.tier_b,0), c=ts.reduce((s,t)=>s+ +t.tier_c,0);
    const tot=a+b+c;
    const ys=ts.flatMap((t)=>[+t.data_year_min,+t.data_year_max]).filter((y)=>y>1900);
    const worst=['empty','unlicensed','stale','watch','ok'].find((k)=>ts.some((t)=>t.health===k))||'ok';
    const lic=[...new Set(ts.flatMap((t)=>(t.licences||'').split(';')).filter(Boolean))];
    return '<div class="card"><h3>'+esc(ds)+' <span class="h h-'+worst+'">'+worst+'</span></h3>'+
      '<div class="sub">'+esc(LAYER_LABEL[ts[0].layer]||ts[0].layer)+'</div>'+
      '<div class="row"><span>tables</span><b>'+ts.length+'</b></div>'+
      '<div class="row"><span>rows</span><b>'+fmtN(ts.reduce((s,t)=>s+ +t.rows,0))+'</b></div>'+
      '<div class="row"><span>data years</span><b>'+(ys.length?Math.min(...ys)+'–'+Math.max(...ys):'—')+'</b></div>'+
      '<div class="row"><span>licences</span><b>'+(lic.length?lic.length:'—')+'</b></div>'+
      (tot?'<div class="bar"><i class="a" style="width:'+(100*a/tot)+'%"></i>'+
        '<i class="b" style="width:'+(100*b/tot)+'%"></i><i class="c" style="width:'+(100*c/tot)+'%"></i></div>'+
        '<div class="row" style="margin-top:4px"><span>tier A / B / C</span><b>'+
        pct(a/tot)+' / '+pct(b/tot)+' / '+pct(c/tot)+'</b></div>':'')+
      '<div class="tlist">'+ts.slice(0,8).map((t)=>'<span class="tchip" data-t="'+esc(t.table)+'">'+esc(t.table)+'</span>').join('')+
      (ts.length>8?'<span class="tchip" data-ds="'+esc(ds)+'">+'+(ts.length-8)+' more</span>':'')+'</div></div>';
  }).join('');
  $('view').innerHTML='<div class="kpis">'+kpis.map(([v,k])=>'<div class="kpi"><div class="v">'+v+'</div><div class="k">'+k+'</div></div>').join('')+'</div>'+
    '<div class="cards">'+cards+'</div>';
  wireTableLinks();
  $('view').querySelectorAll('[data-ds]').forEach((el)=>el.onclick=()=>{state.dataset=el.dataset.ds;setMode('tables');});
}

/* ------------------------------------------------------------ structure */
function drawStructure(){
  // collapse to families, keep only those that take part in a relation
  const fam={};
  TABLES.forEach((t)=>{ const f=FAMILY(t.table);
    (fam[f]=fam[f]||{family:f,layer:t.layer,dataset:t.dataset,members:[],rows:0,health:'ok'}).members.push(t.table);
    fam[f].rows+=+t.rows;
    const order=['ok','watch','stale','unlicensed','empty'];
    if(order.indexOf(t.health)>order.indexOf(fam[f].health)) fam[f].health=t.health; });
  const edges=[];
  const seen=new Set();
  RELATIONS.forEach((r)=>{ const a=FAMILY(r.from_table), b=FAMILY(r.to_table);
    if(a===b) return; const k=a+'>'+b+'|'+r.kind; if(seen.has(k)) return; seen.add(k);
    edges.push({from:a,to:b,kind:r.kind,cols:r.from_columns+' → '+r.to_columns}); });
  const used=new Set(edges.flatMap((e)=>[e.from,e.to]));
  const nodes=Object.values(fam).filter((f)=>used.has(f.family));

  const lanes={}; LAYERS.forEach((l)=>lanes[l]=[]);
  nodes.forEach((n)=>{ (lanes[n.layer]=lanes[n.layer]||[]).push(n); });
  Object.values(lanes).forEach((l)=>l.sort((a,b)=>a.family.localeCompare(b.family)));
  const W=290, GAPX=70, BH=40, GAPY=13, TOP=44;
  const pos={};
  LAYERS.forEach((l,i)=>{ (lanes[l]||[]).forEach((n,j)=>{
    pos[n.family]={x:i*(W+GAPX)+20, y:TOP+j*(BH+GAPY), w:W, h:BH, node:n}; }); });
  const height=TOP+Math.max(...LAYERS.map((l)=>(lanes[l]||[]).length))*(BH+GAPY)+30;
  const width=LAYERS.length*(W+GAPX)+20;

  const link=(e)=>{ const a=pos[e.from], b=pos[e.to]; if(!a||!b) return '';
    const fwd=a.x<b.x; const x1=fwd?a.x+a.w:a.x, x2=fwd?b.x:b.x+b.w;
    const y1=a.y+a.h/2, y2=b.y+b.h/2, mx=(x1+x2)/2;
    return '<path class="link" data-from="'+esc(e.from)+'" data-to="'+esc(e.to)+'" '+
      'data-full="'+esc(e.from+'  →  '+e.to+'\n'+e.kind+' on '+e.cols)+'" '+
      'd="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'"/>'; };
  const box=(f)=>{ const p=pos[f]; const n=p.node;
    const colour='var(--l-'+n.layer+')';
    const fill=n.health==='ok'?'var(--paper)':n.health==='unlicensed'||n.health==='empty'?'var(--bad-soft)':'var(--warn-soft)';
    return '<g class="node" data-t="'+esc(n.members[0])+'" data-f="'+esc(f)+'">'+
      '<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" fill="'+fill+'" stroke="'+colour+'"/>'+
      '<text x="'+(p.x+10)+'" y="'+(p.y+17)+'">'+esc(f)+'</text>'+
      '<text class="meta" x="'+(p.x+10)+'" y="'+(p.y+31)+'">'+
      esc(n.dataset)+' · '+(n.members.length>1?n.members.length+' tables · ':'')+fmtN(n.rows)+' rows</text></g>'; };
  const laneLabels=LAYERS.map((l,i)=>'<text class="lane" x="'+(i*(W+GAPX)+20)+'" y="24">'+esc(LAYER_LABEL[l])+'</text>').join('');

  $('view').innerHTML='<div class="wrap"><div style="padding:12px 16px;border-bottom:1px solid var(--rule);'+
    'font-size:12.5px;color:var(--muted)">Boxes are table families — the per-market variants '+
    '(<code>_eu27 _us _kr _jp</code>) collapse into one. Lines are real joins, drawn left to right '+
    'through the pipeline. Hover a line for the columns it joins on; click a box for its detail. '+
    'A shaded box is one the health check flagged.</div>'+
    '<div class="scroll" style="max-height:calc(100vh - 200px)"><svg viewBox="0 0 '+width+' '+height+'" '+
    'width="'+width+'" height="'+height+'">'+laneLabels+
    edges.map(link).join('')+nodes.map((n)=>box(n.family)).join('')+'</svg></div></div>';
  $('view').querySelectorAll('.node').forEach((g)=>{
    g.onclick=()=>openDetail(g.dataset.t);
    g.onmouseenter=()=>$('view').querySelectorAll('.link').forEach((p)=>{
      p.classList.toggle('hot', p.dataset.from===g.dataset.f||p.dataset.to===g.dataset.f); });
    g.onmouseleave=()=>$('view').querySelectorAll('.link').forEach((p)=>p.classList.remove('hot'));
  });
}

/* ------------------------------------------------------------ tables */
function drawTables(){
  const datasets=[...new Set(TABLES.map((t)=>t.dataset))].sort();
  const healths=[...new Set(TABLES.map((t)=>t.health))].sort();
  const chip=(k,v,label)=>'<button class="chip'+(state[k]===v?' on':'')+'" data-k="'+k+'" data-v="'+esc(v)+'">'+esc(label)+'</button>';
  const bar='<div class="bar2"><span class="lbl">Dataset</span>'+chip('dataset','all','All')+
    datasets.map((d)=>chip('dataset',d,d)).join('')+'</div>'+
    '<div class="bar2"><span class="lbl">Layer</span>'+chip('layer','all','All')+
    LAYERS.map((l)=>chip('layer',l,LAYER_LABEL[l])).join('')+
    '<span style="width:10px"></span><span class="lbl">Health</span>'+chip('health','all','All')+
    healths.map((h)=>chip('health',h,h)).join('')+
    '<span style="flex:1"></span><input type="search" id="q" placeholder="filter by name…" value="'+esc(state.q)+'"></div>';
  const rows=TABLES.filter((t)=>
    (state.dataset==='all'||t.dataset===state.dataset)&&
    (state.layer==='all'||t.layer===state.layer)&&
    (state.health==='all'||t.health===state.health)&&
    (!state.q||t.table.toLowerCase().includes(state.q.toLowerCase())||
      (t.description||'').toLowerCase().includes(state.q.toLowerCase())));
  const body=rows.map((t)=>{
    const tot=+t.tier_a+ +t.tier_b+ +t.tier_c;
    return '<tr><td><span class="name" data-t="'+esc(t.table)+'">'+esc(t.table)+'</span></td>'+
      '<td class="txt">'+esc(t.dataset)+'</td><td class="txt">'+esc(t.kind)+'</td>'+
      '<td>'+fmtN(t.rows)+'</td><td>'+fmtN(t.columns)+'</td>'+
      '<td>'+(t.data_year_min?esc(t.data_year_min)+'–'+esc(t.data_year_max):'—')+'</td>'+
      '<td>'+(tot?pct(t.tier_c_share):'—')+'</td>'+
      '<td class="txt">'+esc((t.licences||'—').split(';')[0])+'</td>'+
      '<td><span class="h h-'+t.health+'">'+esc(t.health)+'</span></td>'+
      clip(t.description)+'</tr>';
  }).join('');
  $('view').innerHTML=bar+'<div class="wrap"><div class="scroll"><table><thead><tr>'+
    '<th>Table</th><th>Dataset</th><th>Kind</th><th>Rows</th><th>Cols</th><th>Data years</th>'+
    '<th>Tier C</th><th>Licence</th><th>Health</th><th>Description</th></tr></thead><tbody>'+
    (body||'<tr><td colspan="10" class="txt">no tables match</td></tr>')+'</tbody></table></div></div>';
  $('view').querySelectorAll('.chip').forEach((b)=>b.onclick=()=>{state[b.dataset.k]=b.dataset.v;drawTables();});
  const q=$('q'); if(q){ q.oninput=()=>{state.q=q.value; drawTables(); const n=$('q'); n.focus();
    n.setSelectionRange(n.value.length,n.value.length); }; }
  wireTableLinks();
}

/* ------------------------------------------------------------ sources */
function drawSources(){
  if(!has('data_providers')||!has('licences')){
    $('view').innerHTML='<div class="card"><h3>No licence catalogue in this file</h3>'+
      '<div class="sub">This database carries no <code>data_providers</code> or <code>licences</code> '+
      'table, so there is nothing to report on where its data came from or what may be '+
      'republished. The Trade database carries both; a file exported from elsewhere generally '+
      'does not.</div></div>';
    return;
  }
  const provs=Q('SELECT * FROM data_providers ORDER BY provider_name');
  const counts={}; if(has('sources')) Q('SELECT provider_id, COUNT(*) n FROM sources GROUP BY provider_id')
    .forEach((r)=>counts[r.provider_id]=r.n);
  const files={}; if(has('redistribution')) Q('SELECT provider_id, COUNT(*) n FROM redistribution GROUP BY provider_id')
    .forEach((r)=>files[r.provider_id]=r.n);
  const licRows=Q('SELECT * FROM licences ORDER BY raw_redistribution, licence_name');
  const verdict=(v)=>'<span class="h h-'+(v==='open'?'ok':v==='derived_only'?'watch':'unlicensed')+'">'+esc(v)+'</span>';
  const lic='<div class="wrap" style="margin-bottom:16px"><div class="scroll"><table><thead><tr>'+
    '<th>Licence</th><th>Category</th><th>Raw redistribution</th><th>Attribution</th>'+
    '<th>Providers</th><th>Terms</th><th>Summary</th></tr></thead><tbody>'+
    licRows.map((l)=>{
      const np=provs.filter((p)=>p.licence_id===l.licence_id).length;
      return '<tr><td><b>'+esc(l.licence_name)+'</b></td><td class="txt">'+esc(l.category)+'</td>'+
        '<td>'+verdict(l.raw_redistribution)+'</td><td class="txt">'+esc(l.attribution)+'</td>'+
        '<td>'+np+'</td><td class="txt">'+(l.url?'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">terms</a>':'—')+'</td>'+
        clip(l.summary)+'</tr>'; }).join('')+'</tbody></table></div></div>';
  const prov='<div class="wrap"><div class="scroll"><table><thead><tr>'+
    '<th>Provider</th><th>Type</th><th>Licence</th><th>Verdict</th><th>Sources</th><th>Raw files</th>'+
    '<th>Website</th></tr></thead><tbody>'+
    provs.map((p)=>{ const l=LICENCES[p.licence_id]||{};
      return '<tr><td><b>'+esc(p.provider_name)+'</b></td><td class="txt">'+esc(p.provider_type)+'</td>'+
        '<td class="txt">'+esc(l.licence_name||p.licence_id)+'</td><td>'+verdict(l.raw_redistribution||'')+'</td>'+
        '<td>'+(counts[p.provider_id]||0)+'</td><td>'+(files[p.provider_id]||0)+'</td>'+
        '<td class="txt"><a href="'+esc(p.website)+'" target="_blank" rel="noopener">'+esc(p.website)+'</a></td></tr>'; }).join('')+
    '</tbody></table></div></div>';
  $('view').innerHTML='<div class="bar2"><span class="lbl">Licences</span></div>'+lic+
    '<div class="bar2"><span class="lbl">Providers</span></div>'+prov;
}

/* ------------------------------------------------------------ detail */
function openDetail(table){
  const t=TABLES.find((x)=>x.table===table); if(!t) return;
  const cols=columnsFor(table);
  const out=RELATIONS.filter((r)=>r.from_table===table);
  const inn=RELATIONS.filter((r)=>r.to_table===table);
  $('d-name').textContent=table;
  $('d-health').innerHTML='<span class="h h-'+t.health+'">'+esc(t.health)+'</span>';
  const tot=+t.tier_a+ +t.tier_b+ +t.tier_c;
  const kv=[
    ['Dataset',t.dataset],['Kind',t.kind],['Layer',LAYER_LABEL[t.layer]||t.layer],
    ['Rows',fmtN(t.rows)],['Columns',fmtN(t.columns)],
    ['Data years',t.data_year_min?t.data_year_min+'–'+t.data_year_max:'—'],
    ['Grain',t.grain||'—'],['Licence',(t.licences||'—')],
    ['Raw redistribution',t.raw_redistribution||'—'],['Health reason',t.health_reason],
    ['Built from',t.source_path||'—'],
  ].map(([k,v])=>'<div><span>'+esc(k)+'</span>'+esc(v)+'</div>').join('');
  const tierBar=tot?'<div class="bar"><i class="a" style="width:'+(100*t.tier_a/tot)+'%"></i>'+
    '<i class="b" style="width:'+(100*t.tier_b/tot)+'%"></i><i class="c" style="width:'+(100*t.tier_c/tot)+'%"></i></div>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:4px">tier A '+fmtN(t.tier_a)+
    ' · B '+fmtN(t.tier_b)+' · C '+fmtN(t.tier_c)+'</div>':'';
  const colTable='<table><thead><tr><th>Column</th><th>Type</th><th>Role</th><th>Blank</th>'+
    '<th>Distinct</th><th>Min</th><th>Max</th><th>Example</th></tr></thead><tbody>'+
    cols.map((c)=>'<tr><td><b>'+esc(c.column)+'</b></td><td class="txt">'+esc(c.type)+'</td>'+
      '<td class="txt">'+esc(c.role)+'</td><td>'+(c.blank_share===''?'—':pct(c.blank_share))+'</td>'+
      '<td>'+fmtN(c.distinct)+'</td><td>'+esc(num2(c.min))+'</td><td>'+esc(num2(c.max))+'</td>'+
      clip(c.example)+'</tr>').join('')+'</tbody></table>';
  const relList=(rs,dir)=>rs.length?rs.map((r)=>'<div style="font-size:12.5px;padding:3px 0">'+
    (dir==='out'?'→ ':'← ')+'<span class="name" data-t="'+esc(dir==='out'?r.to_table:r.from_table)+'">'+
    esc(dir==='out'?r.to_table:r.from_table)+'</span> <span style="color:var(--muted)">'+
    esc(r.kind)+' on '+esc(dir==='out'?r.from_columns:r.to_columns)+'</span></div>').join(''):
    '<div style="font-size:12.5px;color:var(--muted)">none</div>';
  $('d-body').innerHTML='<p style="margin:0 0 14px;color:var(--muted)">'+esc(t.description||'')+'</p>'+
    '<div class="kv">'+kv+'</div>'+tierBar+
    '<div class="sec">Reaches</div>'+relList(out,'out')+
    '<div class="sec">Reached by</div>'+relList(inn,'in')+
    '<div class="sec">Columns ('+cols.length+')</div><div style="overflow:auto">'+colTable+'</div>';
  $('detail').showModal();
  $('d-body').querySelectorAll('.name').forEach((el)=>el.onclick=()=>{$('detail').close();openDetail(el.dataset.t);});
}
function wireTableLinks(){
  $('view').querySelectorAll('[data-t]').forEach((el)=>el.onclick=()=>openDetail(el.dataset.t));
}

/* ------------------------------------------------------------ shell */
function setMode(m){
  state.mode=m;
  $('modes').querySelectorAll('.mode').forEach((b)=>b.classList.toggle('on',b.dataset.mode===m));
  if(location.hash.slice(1)!==m) history.replaceState(null,'','#'+m);
  ({overview:drawOverview,structure:drawStructure,tables:drawTables,sources:drawSources}[m])();
}
$('modes').querySelectorAll('.mode').forEach((b)=>b.onclick=()=>setMode(b.dataset.mode));
$('d-close').onclick=()=>$('detail').close();

function engineReady(){ if(SQL) return Promise.resolve(SQL);
  return initSqlJs({locateFile:(f)=>CDN_DIR+f}).then((s)=>{SQL=s;return s;}); }
function openBytes(buffer,name){
  return engineReady().then((sql)=>{
    DB=new sql.Database(new Uint8Array(buffer)); DB.exec('SELECT 1');
    DERIVED=false; LICENCES={}; PROVIDERS={}; Object.keys(COLCACHE).forEach((k)=>delete COLCACHE[k]);
    if(has('schema_tables')){
      TABLES=Q('SELECT * FROM schema_tables ORDER BY "table"');
      COLUMNS=Q('SELECT * FROM schema_columns ORDER BY "table", CAST(position AS INTEGER)');
      RELATIONS=has('schema_relations')?Q('SELECT * FROM schema_relations'):[];
    } else {
      deriveCatalogue();
    }
    if(has('licences')) Q('SELECT * FROM licences').forEach((l)=>LICENCES[l.licence_id]=l);
    if(has('data_providers')) Q('SELECT * FROM data_providers').forEach((p)=>PROVIDERS[p.provider_id]=p);
    $('opener').classList.add('hidden'); $('app').classList.remove('hidden');
    const as_of=has('sources')?((Q('SELECT MAX(accessed_date) d FROM sources')[0]||{}).d||''):'';
    setStatus('<b>'+esc(name)+'</b>'+(as_of?' · as of '+esc(as_of):'')+
      (DERIVED?' · <span style="color:var(--warn)">described on the fly</span>':''));
    const start=['overview','structure','tables','sources'].includes(location.hash.slice(1))
      ? location.hash.slice(1):'overview';
    setMode(start);
  });
}
function showOpener(m){$('opener-msg').innerHTML=m;$('opener').classList.remove('hidden');setStatus('no database open',true);}
function boot(){
  $('dbfile').addEventListener('change',(e)=>{const f=e.target.files[0]; if(f) f.arrayBuffer().then((b)=>openBytes(b,f.name));});
  if(window.__sqljsFailed){showOpener('sql.js could not be loaded from cdnjs.');return;}
  const src=location.protocol==='file:'?SERVED_DB:DB_RELATIVE;
  setStatus('reading '+esc(DB_FILE)+'…');
  const stop=new AbortController(); const timer=setTimeout(()=>stop.abort(),4000);
  fetch(src,{cache:'no-store',signal:stop.signal})
    .then((r)=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();})
    .then((b)=>{clearTimeout(timer);return openBytes(b,DB_FILE);})
    .catch((e)=>{clearTimeout(timer);showOpener(location.protocol==='file:'
      ?'Opened from the file system, where the browser blocks reading <code>'+esc(DB_FILE)+'</code>. Run serve_app.py.'
      :'Could not read '+esc(DB_FILE)+': '+esc(e.message));});
}
(function(){ const tip=$('tip');
  document.addEventListener('mouseover',(e)=>{const el=e.target.closest('[data-full]');if(!el)return;
    tip.textContent=el.getAttribute('data-full');tip.classList.remove('hidden');});
  document.addEventListener('mousemove',(e)=>{if(tip.classList.contains('hidden'))return;
    const x=Math.min(e.clientX+14,window.innerWidth-tip.offsetWidth-12);
    tip.style.left=Math.max(8,x)+'px';tip.style.top=(e.clientY+16)+'px';});
  document.addEventListener('mouseout',(e)=>{if(e.target.closest('[data-full]'))tip.classList.add('hidden');});
})();
document.addEventListener('DOMContentLoaded', boot);
</script>
